<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Animated background -->
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
    <span class="theme-icon">☀️</span>
  </button>

  <!-- Main container -->
  <div class="login-container">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-bird">
        <div class="bird-body"></div>
        <div class="bird-wing"></div>
        <div class="bird-eye"></div>
        <div class="bird-beak"></div>
      </div>
      <div class="logo-text">
        <h1>Flappy<span>Bird</span></h1>
        <p>The Ultimate Challenge</p>
      </div>
    </div>

    <!-- Auth card -->
    <div class="auth-card" id="authCard">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Sign In</button>
        <button class="tab-btn"        data-tab="register">Register</button>
      </div>

      <!-- ── Login form ─────────────────────────────────────────────────── -->
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="loginUsername">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="loginUsername" placeholder="Enter your username"
                   autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="loginPassword" placeholder="Enter your password"
                   autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="loginPassword"
                    aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span class="checkbox-custom"></span>
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <div class="error-msg" id="loginError" role="alert"></div>

        <button type="submit" class="submit-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader hidden"></span>
        </button>

        <div class="divider"><span>or continue as</span></div>

        <button type="button" class="guest-btn" id="guestBtn">
          🎮 Play as Guest
        </button>
      </form>

      <!-- ── Register form ──────────────────────────────────────────────── -->
      <form class="auth-form hidden" id="registerForm">
        <div class="form-group">
          <label for="regUsername">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="regUsername" placeholder="Choose a username"
                   autocomplete="username" required minlength="3">
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" placeholder="Create a password"
                   autocomplete="new-password" required minlength="4">
            <button type="button" class="toggle-password" data-target="regPassword"
                    aria-label="Toggle password visibility">👁</button>
          </div>
          <div class="password-strength">
            <div class="strength-bar"></div>
            <span class="strength-text"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="regConfirm" placeholder="Confirm your password"
                   autocomplete="new-password" required>
            <button type="button" class="toggle-password" data-target="regConfirm"
                    aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <div class="error-msg" id="registerError" role="alert"></div>

        <button type="submit" class="submit-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader hidden"></span>
        </button>
      </form>

    </div><!-- /auth-card -->

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar">
      <div class="stat">
        <span class="stat-icon">🏆</span>
        <span class="stat-label">Best Score</span>
        <span class="stat-value" id="displayHighScore">0</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-icon">🎮</span>
        <span class="stat-label">Games Played</span>
        <span class="stat-value" id="displayGames">0</span>
      </div>
    </div>

  </div><!-- /login-container -->

  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
