<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

  <!-- Game canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- ── HUD ────────────────────────────────────────────────────────────── -->
  <header class="hud" role="banner">
    <div class="hud-left">
      <div class="score-display">
        <span class="score-label">Score</span>
        <span class="score-value" id="hudScore">0</span>
      </div>
      <div class="high-score-display">
        <span class="hs-icon">🏆</span>
        <span class="hs-value" id="hudHighScore">0</span>
      </div>
    </div>

    <div class="hud-right">
      <div class="user-badge">
        <span class="user-avatar">🐦</span>
        <span class="user-name" id="hudUsername">Player</span>
      </div>
      <button class="hud-btn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸</button>
      <button class="hud-btn theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <span class="theme-icon">☀️</span>
      </button>
      <button class="hud-btn" id="homeBtn" title="Home" aria-label="Go home">🏠</button>
    </div>
  </header>

  <!-- ── Start Screen ───────────────────────────────────────────────────── -->
  <div class="overlay" id="startScreen" role="dialog" aria-label="Start game">
    <div class="overlay-card">
      <div class="overlay-bird" aria-hidden="true">🐦</div>
      <h2>Ready to Fly?</h2>
      <p>Navigate through the pipes and set a new high score!</p>

      <div class="controls-hint">
        <div class="hint-item"><kbd>Space</kbd> / <kbd>↑</kbd> Flap</div>
        <div class="hint-item"><kbd>P</kbd> Pause</div>
        <div class="hint-item">📱 Tap anywhere</div>
      </div>

      <button class="play-btn" id="startBtn">▶ Play Now</button>
    </div>
  </div>

  <!-- ── Game Over Screen ───────────────────────────────────────────────── -->
  <div class="overlay hidden" id="gameOverScreen" role="dialog" aria-label="Game over">
    <div class="overlay-card game-over-card">

      <div class="game-over-title">
        <span class="go-icon" aria-hidden="true">💀</span>
        <h2>Game Over</h2>
      </div>

      <div class="score-results">
        <div class="result-row">
          <span>Score</span>
          <span class="result-val" id="finalScore">0</span>
        </div>
        <div class="result-row best">
          <span>Best</span>
          <span class="result-val" id="finalBest">0</span>
          <span class="new-best hidden" id="newBest">NEW!</span>
        </div>
      </div>

      <div class="medal-display" id="medalDisplay" aria-live="polite"></div>

      <div class="game-over-btns">
        <button class="play-btn"      id="restartBtn">↺ Play Again</button>
        <button class="secondary-btn" id="goHomeBtn">🏠 Main Menu</button>
      </div>

    </div>
  </div>

  <!-- ── Pause Screen ───────────────────────────────────────────────────── -->
  <div class="overlay hidden" id="pauseScreen" role="dialog" aria-label="Game paused">
    <div class="overlay-card">
      <span class="pause-icon" aria-hidden="true">⏸</span>
      <h2>Paused</h2>
      <p>Take a breath. The pipes are waiting.</p>
      <div class="pause-btns">
        <button class="play-btn"      id="resumeBtn">▶ Resume</button>
        <button class="secondary-btn" id="pauseHomeBtn">🏠 Main Menu</button>
      </div>
    </div>
  </div>

  <!-- Score popup -->
  <div class="score-popup hidden" id="scorePopup" aria-hidden="true">+1</div>

  <script src="js/theme.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
